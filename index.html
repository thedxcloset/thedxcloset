<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The DX Closet - Trendy Fashion Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">The DX <span>Closet</span></a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li>
                    <a href="cart.html" class="cart-link">
                        <i class="fas fa-shopping-bag"></i>
                        <span class="cart-badge" id="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Elevate Your Everyday Style</h1>
            <p>Discover trendy, affordable, and premium quality fashion collections.</p>
            <a href="shop.html" class="btn-primary">Shop Now</a>
        </div>

    <!-- Featured Section -->
    <main class="container">
        <h2 class="section-title">Featured Collections</h2>
        <div class="product-grid" id="featured-products"></div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-container">
            <div>
                <h3>The DX Closet</h3>
                <p>Your destination for modern fashion trends.</p>
            </div>
            <div class="footer-socials">
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-tiktok"></i></a>
                <a href="#"><i class="fab fa-whatsapp"></i></a>

        </div>

        </div>
    </footer>

    <script src="script.js"></script>
