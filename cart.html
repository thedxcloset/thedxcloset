<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - The DX Closet</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">The DX <span>Closet</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li>
                    <a href="cart.html" class="cart-link active">
                        <i class="fas fa-shopping-bag"></i>
                        <span class="cart-badge" id="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">Your Shopping Cart</h2>
        
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="cart-table-body">
                <!-- Populated by JavaScript -->
            </tbody>
        </table>

        <div class="cart-summary">
            <div class="summary-row">
                <span>Total:</span>
                <strong id="cart-total-price">$0.00</strong>
            </div>
            <button class="checkout-btn" onclick="checkoutWhatsApp()">
                <i class="fab fa-whatsapp"></i> Checkout via WhatsApp
            </button>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div>
                <h3>The DX Closet</h3>
                <p>Your destination for modern fashion trends.</p>
            </div>
            <div class="footer-socials">
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-tiktok"></i></a>
                <a href="#"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 The DX Closet. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
